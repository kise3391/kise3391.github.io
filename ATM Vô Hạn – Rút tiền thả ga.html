<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATM Vô Hạn – Rút tiền thả ga</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #150b2a;
  --panel: #1d1136;
  --card: #160d2b;
  --line: #3a2666;
  --ink: #f6efff;
  --mute: #a897c9;
  --mint: #4ff2b5;
  --gold: #ffcf4d;
  --hot: #ff5d8f;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Baloo 2', system-ui, 'Segoe UI', sans-serif;
  overflow: hidden;
}

#app {
  display: grid;
  grid-template-columns: 1fr 370px;
  height: 100%;
}

#stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
}

#hud {
  position: absolute;
  top: 8px;
  left: 0;
  right: 0;
  padding: 0 56px;
  text-align: center;
  pointer-events: none;
}

#bal {
  display: inline-block;
  font-size: clamp(28px, 5.2vw, 52px);
  font-weight: 800;
  line-height: 1.1;
  color: var(--gold);
  text-shadow: 0 3px 0 #8a4b00, 0 0 24px rgba(255, 207, 77, 0.5);
  transform-origin: center;
}

#stat {
  font-size: 12px;
  color: var(--mute);
}

#mute {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: rgba(29, 17, 54, 0.8);
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
}

#combo {
  position: absolute;
  top: 34%;
  right: 5%;
  font-size: clamp(20px, 4vw, 38px);
  font-weight: 800;
  color: var(--hot);
  text-shadow: 0 3px 0 #4a0c25, 0 0 20px rgba(255, 93, 143, 0.7);
  opacity: 0;
  pointer-events: none;
  transform: rotate(-6deg);
}

#combo.pp {
  animation: pp 0.25s ease-out;
}

@keyframes pp {
  0% {
    transform: scale(1.7) rotate(-6deg);
  }

  100% {
    transform: scale(1) rotate(-6deg);
  }
}

#toast {
  position: absolute;
  top: 22%;
  left: 50%;
  max-width: min(90%, 420px);
  padding: 10px 16px;
  border: 1px solid var(--gold);
  border-radius: 14px;
  background: rgba(20, 10, 40, 0.92);
  text-align: center;
  font-size: 15px;
  line-height: 1.3;
  opacity: 0;
  transform: translate(-50%, -8px);
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

#ctl {
  position: absolute;
  right: 0;
  bottom: 12px;
  left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

#ctl > * {
  pointer-events: auto;
}

#chips {
  display: flex;
  gap: 6px;
  max-width: 100%;
  padding: 2px 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

#chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink);
  font: 600 13px 'Baloo 2', system-ui, sans-serif;
  cursor: pointer;
  white-space: nowrap;
}

.chip.on {
  border-color: var(--gold);
  background: var(--gold);
  color: #3a1d00;
}

#wd {
  padding: 8px 38px;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(#ffe790, #ffb52e);
  box-shadow: 0 6px 0 #a86300, 0 12px 28px rgba(255, 181, 46, 0.4);
  color: #3a1d00;
  font: 800 clamp(18px, 3.6vw, 26px) 'Baloo 2', system-ui, sans-serif;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

#wd:active {
  box-shadow: 0 2px 0 #a86300;
  transform: translateY(4px);
}

#hint {
  font-size: 11px;
  color: var(--mute);
}

#shop {
  min-height: 0;
  padding: 12px;
  border-left: 1px solid var(--line);
  background: var(--panel);
  overflow-y: auto;
}

#shop h2 {
  margin: 0;
  font-size: 19px;
}

#shop p {
  margin: 0 0 4px;
  color: var(--mute);
  font-size: 12px;
}

.it {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}

.it .em {
  flex: none;
  width: 44px;
  text-align: center;
  font-size: 32px;
}

.it .tx {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
}

.it b {
  font-size: 14px;
  line-height: 1.2;
}

.it small {
  color: var(--mute);
  font-size: 11.5px;
  line-height: 1.25;
}

.pr {
  color: var(--gold);
  font-size: 13px;
  font-weight: 800;
}

.it button {
  flex: none;
  padding: 6px 14px;
  border: 0;
  border-radius: 10px;
  background: var(--mint);
  color: #053a29;
  font: 800 14px 'Baloo 2', system-ui, sans-serif;
  cursor: pointer;
}

.it button:disabled {
  background: #3a2c58;
  color: #8a7bb0;
  cursor: not-allowed;
}

.it.cant {
  opacity: 0.6;
}

button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 2px;
}

@media (max-width: 820px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 64% 36%;
  }

  #shop {
    border-top: 1px solid var(--line);
    border-left: 0;
  }

  #toast {
    top: 16%;
  }

  #combo {
    top: 30%;
  }
}

@media (prefers-reduced-motion: reduce) {
  #combo.pp {
    animation: none;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div id="bal">0 ₫</div>
      <div id="stat"></div>
    </div>
    <button id="mute" aria-label="Bật tắt âm thanh">🔊</button>
    <div id="combo"></div>
    <div id="toast"></div>
    <div id="hint" style="position:absolute;bottom:8px;left:0;right:0;text-align:center;pointer-events:none">
      Bấm số trên ATM (hoặc gõ bàn phím) rồi bấm RÚT. Giữ nút RÚT để rút liên tục.
    </div>
  </div>
  <aside id="shop">
    <h2>🛒 Cửa hàng tiêu tiền</h2>
    <p>Càng đắt càng vô lý. Mua thêm thì giá tăng 30%.</p>
    <div id="items"></div>
  </aside>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv');
const cx = cv.getContext('2d');
const U = [
  [1e21, 'nghìn tỷ tỷ'],
  [1e18, 'tỷ tỷ'],
  [1e15, 'triệu tỷ'],
  [1e12, 'nghìn tỷ'],
  [1e9, 'tỷ'],
  [1e6, 'triệu']
];

function num(n) {
  for (const [v, u] of U) {
    if (n >= v) {
      const x = n / v;
      let s = x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
      if (s.includes('.')) s = s.replace(/\.?0+$/, '');
      return s.replace('.', ',') + ' ' + u;
    }
  }

  return Math.floor(n).toLocaleString('vi-VN');
}

const fmt = n => num(n) + ' ₫';
const AM = [1e6, 1e8, 1e10, 1e12, 1e14, 1e16, 1e18, 1e20, 1e22];
const DN = [
  { c: '#4fae5f', t: '100K' },
  { c: '#d0554d', t: '200K' },
  { c: '#3f9fd0', t: '500K' },
  { c: '#e8b923', t: '∞' }
];
const ITEMS=[
  {e:'🧋',n:'Ly trà đá vỉa hè',d:'Mát lạnh. Ví thì nóng.',p:5e3,q:'Ực ực... Trà đá cũng có đá của nó.'},
  {e:'🍜',n:'Tô phở gầu 7 tầng thịt',d:'Bánh phở chỉ có mặt để làm màu.',p:4e5,q:'Không thấy bánh phở đâu, chỉ thấy thịt.'},
  {e:'🛵',n:'Xe Wave độ 12 loa kéo',d:'Hàng xóm biết bạn về trước cả khi bạn về.',p:3e7,q:'Bíp bíp! Cả phố đã nghe thấy bạn.'},
  {e:'⛓️',n:'Dây chuyền vàng to bằng dây xích chó',d:'Đeo xong đi bộ nghiêng 15 độ.',p:6e8,q:'Cổ bạn giờ có bảo hiểm riêng.'},
  {e:'🐕',n:'Chó Phú Quốc mặc vest, có thư ký riêng',d:'Sủa được 3 ngoại ngữ.',p:5e9,q:'Gâu! (dịch: "Sếp, 3 giờ có họp.")'},
  {e:'🏯',n:'Biệt thự có ao cá koi trên nóc',d:'Cá koi đi máy bay hạng thương gia.',p:8e10,q:'Cá koi vừa đòi tăng lương.'},
  {e:'🏎️',n:'Siêu xe bọc vàng, chạy tối đa 5 km/h',d:'Vì sợ xước vàng.',p:9e11,q:'Bị xe máy vượt lần thứ 40 rồi.'},
  {e:'🛥️',n:'Du thuyền đậu ở Hồ Tây',d:'Có bãi đáp trực thăng cho chuồn chuồn.',p:8e12,q:'Vịt trên hồ đã xin làm thuyền viên.'},
  {e:'✈️',n:'Máy bay riêng chỉ để bay đi mua bánh mì',d:'Bánh nguội trước khi về, nhưng là nguội hạng nhất.',p:9e13,q:'Phi công hỏi: "Sếp, bánh mì không hành ạ?"'},
  {e:'🗿',n:'Tượng vàng chính mình cao 50 mét',d:'Đội nón lá, tay cầm điện thoại.',p:1e15,q:'Chim bồ câu đã xin phép đậu lên mũi bạn.'},
  {e:'🚀',n:'Tên lửa lên Sao Hỏa uống cà phê',d:'Ở đó chưa có quán. Nhớ mang phin.',p:2e16,q:'3... 2... 1... cà phê sữa đá!'},
  {e:'🌙',n:'Sổ đỏ Mặt Trăng (có nhà vệ sinh)',d:'Ánh sáng miễn phí, bãi đỗ xe vô tận.',p:1e18,q:'Chị Hằng đã bị nhắc nhở về tiền thuê nhà.'},
  {e:'🌌',n:'Mua luôn cả Vũ Trụ (bảo hành 7 ngày)',d:'Đổi trả trong 3 ngày nếu chưa bóc tem Big Bang.',p:1e21,q:'Chúc mừng! Bạn sở hữu mọi thứ. ATM vẫn còn tiền.'}
];
ITEMS.forEach(it => it.own = 0);
let money = 0, earned = 0, spent = 0, sel = 0, disp = 0, combo = 0, lastW = 0,
    muted = false, sh = 0, glow = 0, flash = 0, fc = '255,255,255', bs = 1,
    msg = {t: 0}, L = {}, W = 0, H = 0;
const KEY = 'atmvohan_v1';

try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s) {
    money = s.m || 0;
    earned = s.e || 0;
    spent = s.s || 0;
    disp = money;
    (s.o || []).forEach((v, i) => {
      if (ITEMS[i]) ITEMS[i].own = v || 0;
    });
  }
} catch (e) {}

let st;
function save() {
  clearTimeout(st);
  st = setTimeout(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        m: money,
        e: earned,
        s: spent,
        o: ITEMS.map(i => i.own)
      }));
    } catch (e) {}
  }, 400);
}

const price = i => Math.round(ITEMS[i].p * Math.pow(1.3, ITEMS[i].own));

/* ---------- ÂM THANH ---------- */
let AC,master,NB;
function initAudio(){
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=muted?0:.6;master.connect(comp);comp.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();
}
function tone(f,t,d,type,v,to){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function noise(t,d,fc,v,q){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5,d+.05)}
const PENT=[0,2,4,7,9,12,14,16,19];
function sfxW(tier,cb){if(!AC)return;const t=AC.currentTime,p=Math.pow(2,Math.min(cb-1,12)/12);
  tone(70,t,.28,'sawtooth',.08,140);
  for(let i=0;i<6+tier;i++)noise(t+.04+i*.03,.03,4500+i*150,.22,1.5);
  noise(t+.05,.4,2500,.25,.6);
  const c=t+.16;[[1319,.22],[1976,.16],[2637,.1]].forEach(([f,v])=>tone(f*p,c,.6,'triangle',v));
  tone(2093*p,c+.09,.7,'sine',.14);
  tone(140,t+.12,.22,'sine',.55,45);
  for(let i=0;i<Math.min(2+tier,9);i++)tone(880*p*Math.pow(2,PENT[i]/12),c+.12+i*.045,.28,'sine',.09);
  if(tier>=5)[261.6,329.6,392,523.3].forEach(f=>tone(f*p,c,.6,'sawtooth',.05));
  if(tier>=7)tone(50,t,1.2,'sine',.8,25);
}
function sfxBuy(i){if(!AC)return;const t=AC.currentTime;
  noise(t,.05,2000,.5,1);tone(880,t+.02,.25,'square',.06);
  [1046,1318,1568,2093].forEach((f,k)=>tone(f,t+.06+k*.06,.4,'triangle',.18));
  tone(110,t,.3,'sine',.6,45);
  if(i>=4)[261.6,329.6,392,523.3].forEach((f,k)=>tone(f,t+.3+k*.09,.5,'sawtooth',.07));
  if(i>=8){tone(200,t+.3,1.2,'sawtooth',.1,1600);noise(t+.3,1.2,900,.2,.5)}
  if(i>=12){tone(60,t+.5,2,'sine',.8,25);[523,659,784,1046,1319,1568].forEach((f,k)=>tone(f,t+.6+k*.12,.9,'triangle',.14))}
}
function tick(){if(AC)tone(500+sel*90,AC.currentTime,.08,'square',.06)}

/* ---------- KHUNG HÌNH ---------- */
function layout(){const floor=H-56,top=Math.max(66,H*.1),aw=Math.max(90,Math.min(W*.7,340,(floor-top-8)/1.55)),ah=aw*1.55,ay=floor-8-ah;L={floor,aw,ah,ax:W/2-aw/2,ay,sx:W/2,sy:ay+aw*1.375}}
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);layout()}
new ResizeObserver(resize).observe(cv);resize();

/* ---------- HẠT ---------- */
const P=[];
const rnd=Math.random;
function bill(x,y,vx,vy,tier){const dn=DN[Math.min(3,rnd()*(1+tier/2.5)|0)];P.push({k:0,x,y,vx,vy,r:rnd()*6.28,vr:(rnd()-.5)*.2,ph:rnd()*6.28,pv:.06+rnd()*.1,w:42+tier*2+rnd()*8,dn,fy:L.floor+rnd()*22-4,life:1,land:0})}
function txt(t,c,x,y,s){P.push({k:4,t,c,x:x??L.sx,y:y??L.sy-50,vy:-1.3,s:s||22,life:1})}
function withdraw(a){
  initAudio();const now=performance.now();combo=now-lastW<700?Math.min(combo+1,40):1;lastW=now;
  const tier=Math.max(0,Math.min(8,Math.round((Math.log10(a)-6)/2)));lastAmt=a;money+=a;earned+=a;
  const n=10+tier*4+Math.min(combo,10);
  for(let i=0;i<n;i++)bill(L.sx+(rnd()-.5)*L.aw*.4,L.sy,(rnd()-.5)*(7+tier),-(7+rnd()*(7+tier*.5)),tier);
  for(let i=0;i<Math.max(0,tier-1)*7;i++)bill(rnd()*W,-30-rnd()*H*.6,(rnd()-.5)*2,1+rnd()*2,tier);
  if(tier>=3)for(let i=0;i<tier*3;i++)P.push({k:1,x:L.sx,y:L.sy,vx:(rnd()-.5)*10,vy:-(6+rnd()*8),r:0,vr:0,ph:rnd()*6,pv:.3,s:6+rnd()*4,fy:L.floor+8+rnd()*14,life:1,land:0});
  for(let i=0;i<20+tier*6;i++){const an=rnd()*6.28,s=2+rnd()*7;P.push({k:2,x:L.sx,y:L.sy,vx:Math.cos(an)*s,vy:Math.sin(an)*s-3,life:1,s:1.5+rnd()*2.5})}
  txt('+'+fmt(a),'#ffe27a',L.sx+(rnd()-.5)*60,L.sy-40,20+tier*1.5);
  if(P.length>900)P.splice(0,P.length-900);
  sh=Math.min(4+tier*3+combo*.4,28);glow=1;flash=Math.max(flash,.04+tier*.02);fc='255,240,180';bs=1.18;
  const cb=$('combo');if(combo>=3){cb.textContent='COMBO ×'+combo;cb.classList.remove('pp');void cb.offsetWidth;cb.classList.add('pp');cb.style.opacity=1}
  sfxW(tier,combo);refresh();save();
}
function buy(i){
  initAudio();const it=ITEMS[i],pr=price(i);if(money<pr)return;
  money-=pr;spent+=pr;it.own++;sfxBuy(i);sh=Math.max(sh,8+i*1.5);flash=.15+i*.02;fc=i>=9?'255,207,77':'255,255,255';
  for(let k=0;k<6+i;k++)P.push({k:3,e:it.e,x:L.sx+(rnd()-.5)*L.aw*.6,y:L.sy,vx:(rnd()-.5)*8,vy:-(6+rnd()*9),r:0,vr:(rnd()-.5)*.2,ph:0,pv:0,s:24+i*3,fy:L.floor+10,life:1,land:0});
  txt('-'+fmt(pr),'#ff7a9c',L.sx,L.sy-50,22);
  msg={a:'ĐÃ MUA!',b:it.e+' x'+it.own,t:1800};
  toast(it.e+' <b>'+it.n+'</b><br>'+it.q);refresh();save();
}
let tt;function toast(h){const t=$('toast');t.innerHTML=h;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3400)}

/* ---------- CẬP NHẬT ---------- */
function update(dt,now){
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    if(p.k===4){p.y+=p.vy*dt;p.life-=.014*dt;if(p.life<=0)P.splice(i,1);continue}
    if(p.k===2){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.1*dt;p.life-=.03*dt;if(p.life<=0)P.splice(i,1);continue}
    if(p.land){p.life-=.012*dt;if(p.life<=0)P.splice(i,1);continue}
    p.vy+=.32*dt;p.vx*=.994;p.x+=(p.vx+(p.k===0?Math.sin(p.ph)*.9:0))*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.ph+=p.pv*dt;
    if(p.k===0&&p.vy>3)p.vy=3;
    if(p.y>p.fy){p.y=p.fy;
      if(p.k===1&&Math.abs(p.vy)>2.5){p.vy*=-.45;p.vx*=.7}
      else if(p.k===3&&p.vy>3){p.vy*=-.35}
      else{p.land=1;p.ph=0;p.vr=0;if(p.k===3)P.splice(i,1)}}
  }
  sh*=Math.pow(.88,dt);if(sh<.1)sh=0;glow=Math.max(0,glow-.03*dt);flash=Math.max(0,flash-.02*dt);
  if(msg.t>0)msg.t-=dt*16.7;
  bs+=(1-bs)*.15*dt;
  disp+=(money-disp)*Math.min(1,.15*dt);if(Math.abs(money-disp)<=Math.max(1,Math.abs(money)*1e-4))disp=money;
  if(combo&&now-lastW>1100){combo=0;$('combo').style.opacity=0}
}

/* ---------- VẼ ---------- */
function rr(x,y,w,h,r){cx.beginPath();if(cx.roundRect)cx.roundRect(x,y,w,h,r);else cx.rect(x,y,w,h)}
const FONT='"Baloo 2",system-ui,sans-serif',EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let buf='',lastAmt=0,pressK=null,pressT=0;
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function scr(now){if(msg.t>0)return[msg.a,msg.b,''];if(glow>.05)return['ĐANG ĐẾM TIỀN...','+'+num(lastAmt)+' ₫','VUI LÒNG CHỜ'];const a=Number(buf||0);return['NHẬP SỐ TIỀN CẦN RÚT',buf?grp(buf)+' ₫':((now/500|0)%2?'_':' '),a>=1e6?'= '+fmt(a):'SỐ DƯ: ∞']}
function keys(){const{ax,ay,aw}=L,u=aw/100,k=[];
  ['1','2','3','4','5','6','7','8','9','000','0','00'].forEach((d,i)=>k.push({v:d,t:d,c:'#6d6299',x:ax+(10+(i%3)*17)*u,y:ay+(68+((i/3)|0)*11)*u,w:15*u,h:9*u}));
  k.push({v:'C',t:'HỦY',c:'#e0455f',x:ax+64*u,y:ay+68*u,w:26*u,h:9*u});
  k.push({v:'B',t:'SỬA',c:'#f0b93a',x:ax+64*u,y:ay+79*u,w:26*u,h:9*u});
  k.push({v:'E',t:'RÚT',c:'#29c98a',x:ax+64*u,y:ay+90*u,w:26*u,h:20*u});
  return k}
function drawATM(now){
  const{ax,ay,aw}=L,u=aw/100,R=(x,y,w,h,r)=>rr(ax+x*u,ay+y*u,w*u,h*u,r*u);cx.save();cx.translate((rnd()-.5)*sh,(rnd()-.5)*sh);
  const gl=cx.createRadialGradient(W/2,L.sy,5,W/2,L.sy,aw*1.3);gl.addColorStop(0,`rgba(79,242,181,${.12+glow*.5})`);gl.addColorStop(1,'rgba(79,242,181,0)');cx.fillStyle=gl;cx.fillRect(-40,-40,W+80,H+80);
  const bg=cx.createLinearGradient(ax,ay,ax+aw,ay);bg.addColorStop(0,'#5a5286');bg.addColorStop(.5,'#3a3260');bg.addColorStop(1,'#241c42');
  cx.fillStyle=bg;R(0,0,100,155,5);cx.fill();cx.lineWidth=2;cx.strokeStyle='#7b6cb0';cx.stroke();
  cx.fillStyle='rgba(255,255,255,.05)';R(3,3,94,149,3);cx.fill();
  cx.fillStyle='#0b2a22';R(10,4,80,11,3);cx.fill();
  cx.textAlign='center';cx.textBaseline='middle';cx.shadowColor='#4ff2b5';cx.shadowBlur=12+glow*20;cx.fillStyle='#4ff2b5';cx.font=`800 ${8*u}px ${FONT}`;cx.fillText('ATM VÔ HẠN',W/2,ay+10*u,72*u);cx.shadowBlur=0;
  cx.fillStyle='#0d0820';[6,94].forEach(x=>{cx.beginPath();cx.arc(ax+x*u,ay+9.5*u,1.4*u,0,7);cx.fill()});
  cx.fillStyle='#120a26';R(8,18,84,44,3);cx.fill();
  cx.fillStyle='#6d6299';for(let i=0;i<4;i++){R(9,24+i*8,4,4,1);cx.fill();R(87,24+i*8,4,4,1);cx.fill()}
  cx.fillStyle='#051c16';R(15,22,70,36,2);cx.fill();cx.strokeStyle='#1e7a5c';cx.lineWidth=1.5;cx.stroke();
  const[l1,l2,l3]=scr(now),sy=ay+22*u;
  cx.fillStyle='#7dffcf';cx.font=`600 ${4*u}px monospace`;cx.fillText(l1,W/2,sy+6*u,66*u);
  cx.fillStyle='#fff';cx.font=`800 ${8*u}px monospace`;cx.fillText(l2,W/2,sy+18*u,66*u);
  cx.fillStyle='#7dffcf';cx.font=`600 ${3.6*u}px monospace`;cx.fillText(l3,W/2,sy+30*u,66*u);
  for(const k of keys()){const pr=pressK===k.v&&now-pressT<130,dy=pr?1.2*u:0;
    cx.fillStyle='rgba(0,0,0,.45)';rr(k.x,k.y+2*u,k.w,k.h,2*u);cx.fill();
    cx.fillStyle=k.c;rr(k.x,k.y+dy,k.w,k.h,2*u);cx.fill();
    cx.fillStyle='rgba(255,255,255,.22)';rr(k.x,k.y+dy,k.w,k.h*.35,2*u);cx.fill();
    cx.fillStyle=(k.v==='B'||k.v==='E')?'#1a0d00':'#fff';cx.font=`800 ${(k.h>15*u?6:k.t.length>2?4.2:5.2)*u}px ${FONT}`;cx.fillText(k.t,k.x+k.w/2,k.y+k.h/2+dy,k.w*.9)}
  cx.fillStyle='#0d0820';R(10,114,35,4,2);cx.fill();R(55,114,35,4,2);cx.fill();
  cx.fillStyle=(now/300|0)%2?'#4ff2b5':'#1b5d47';cx.beginPath();cx.arc(ax+50*u,ay+116*u,1.4*u,0,7);cx.fill();
  cx.fillStyle='#a897c9';cx.font=`600 ${3*u}px ${FONT}`;cx.fillText('THẺ',ax+27.5*u,ay+121*u);cx.fillText('BIÊN LAI',ax+72.5*u,ay+121*u);
  cx.fillStyle='#120a26';R(10,125,80,22,3);cx.fill();
  cx.fillStyle='#a897c9';cx.fillText('NHẬN TIỀN',W/2,ay+128.5*u);
  cx.fillStyle='#070312';R(16,134,68,7,2);cx.fill();
  cx.fillStyle=`rgba(79,242,181,${.35+glow*.65})`;cx.shadowColor='#4ff2b5';cx.shadowBlur=10+glow*25;R(18,138.3,64,2,1);cx.fill();cx.shadowBlur=0;
  const fh=7*(1-Math.min(1,glow*2));if(fh>.2){const fg=cx.createLinearGradient(0,ay+134*u,0,ay+141*u);fg.addColorStop(0,'#6d6299');fg.addColorStop(1,'#3a3260');cx.fillStyle=fg;R(16,134,68,fh,2);cx.fill()}
  cx.restore();
}
function drawItems(now){
  const own=ITEMS.map((it,i)=>[it,i]).filter(a=>a[0].own>0);if(!own.length)return;
  const slot=W/(own.length+1);cx.textAlign='center';cx.textBaseline='bottom';
  own.forEach(([it,i],k)=>{const size=Math.min(26+i*4.5,slot*.9,80),x=slot*(k+1),bob=Math.abs(Math.sin(now/400+i))*5;
    cx.fillStyle='#fff';cx.font=`${size}px ${EMO}`;cx.fillText(it.e,x,L.floor+24-bob);
    if(it.own>1){cx.fillStyle='#ffcf4d';cx.font=`800 13px ${FONT}`;cx.fillText('×'+it.own,x+size*.45,L.floor+28)}});
}
function drawBill(p){
  const c=Math.cos(p.ph),a=Math.max(.12,Math.abs(c))*(p.land?.6:1),w=p.w,h=w*.48;
  cx.save();cx.globalAlpha=Math.min(1,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,a);
  cx.fillStyle=p.dn.c;cx.fillRect(-w/2,-h/2,w,h);cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=1.5;cx.strokeRect(-w/2+2,-h/2+2,w-4,h-4);
  cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(0,0,h*.32,0,7);cx.fill();
  if(w>34){cx.fillStyle='rgba(255,255,255,.95)';cx.font=`800 ${w*.2}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.dn.t,0,1)}
  if(c<0){cx.fillStyle='rgba(0,0,0,.28)';cx.fillRect(-w/2,-h/2,w,h)}
  cx.restore();
}
function drawP(){
  for(const p of P){
    if(p.k===0)drawBill(p);
    else if(p.k===1){cx.save();cx.globalAlpha=Math.min(1,p.life);cx.translate(p.x,p.y);cx.scale(Math.max(.15,Math.abs(Math.cos(p.ph))),1);cx.fillStyle='#ffcf4d';cx.strokeStyle='#b8860b';cx.lineWidth=2;cx.beginPath();cx.arc(0,0,p.s,0,7);cx.fill();cx.stroke();cx.fillStyle='rgba(255,255,255,.6)';cx.fillRect(-p.s*.3,-p.s*.5,p.s*.25,p.s*.6);cx.restore()}
    else if(p.k===2){cx.save();cx.globalCompositeOperation='lighter';cx.fillStyle=`rgba(255,220,120,${Math.max(0,p.life)})`;cx.beginPath();cx.arc(p.x,p.y,p.s*p.life+.5,0,7);cx.fill();cx.restore()}
    else if(p.k===3){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r*0+p.y*.02*(p.vr>0?1:-1));cx.font=`${p.s}px ${EMO}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.e,0,0);cx.restore()}
    else{cx.save();cx.globalAlpha=Math.max(0,p.life);cx.font=`800 ${p.s}px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=5;cx.strokeStyle='rgba(20,8,40,.9)';cx.lineJoin='round';cx.strokeText(p.t,p.x,p.y);cx.fillStyle=p.c;cx.fillText(p.t,p.x,p.y);cx.restore()}
  }
}
function draw(now){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#150b2a');g.addColorStop(1,'#2b1249');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#0f0620';cx.fillRect(0,L.floor,W,H-L.floor);cx.fillStyle='rgba(255,93,143,.5)';cx.fillRect(0,L.floor,W,2);
  drawATM(now);drawItems(now);drawP();
  if(flash>.01){cx.fillStyle=`rgba(${fc},${flash})`;cx.fillRect(0,0,W,H)}
}
const bal=$('bal');let lastS='',last=performance.now();
function frame(now){const dt=Math.min(2,(now-last)/16.667);last=now;update(dt,now);draw(now);
  const s=fmt(disp);if(s!==lastS){bal.textContent=s;lastS=s}bal.style.transform=`scale(${bs})`;requestAnimationFrame(frame)}

/* ---------- GIAO DIỆN ---------- */
const box=$('items');
ITEMS.forEach((it,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<div class="em">${it.e}</div><div class="tx"><b>${it.n}</b><small>${it.d}</small><span class="pr"></span></div><button>Mua</button>`;it.el=d;it.pr=d.querySelector('.pr');it.btn=d.querySelector('button');it.btn.onclick=()=>buy(i);box.append(d)});
function refresh(){ITEMS.forEach((it,i)=>{const pr=price(i),ok=money>=pr;it.pr.textContent=fmt(pr)+(it.own?' · đang có ×'+it.own:'');it.el.classList.toggle('cant',!ok);it.btn.disabled=!ok});$('stat').textContent='Đã rút '+fmt(earned)+' · Đã tiêu '+fmt(spent)}
function press(v){initAudio();pressK=v;pressT=performance.now();
  if(v==='E'){const a=Number(buf||0);if(!(a>0)){msg={a:'SỐ TIỀN KHÔNG',b:'HỢP LỆ',t:1200};sh=Math.max(sh,6);if(AC){const t=AC.currentTime;tone(160,t,.25,'square',.12);tone(120,t+.12,.25,'square',.12)}return}withdraw(a);return}
  if(v==='C'){buf='';if(AC)tone(300,AC.currentTime,.15,'sawtooth',.08,180);return}
  if(v==='B'){buf=buf.slice(0,-1);if(AC)tone(700,AC.currentTime,.06,'square',.06);return}
  buf=(buf+v).replace(/^0+/,'');if(buf.length>22)buf=buf.slice(0,22);
  if(AC){const t=AC.currentTime,f=700+(+v[0])*70;tone(f,t,.07,'square',.06);tone(f*1.5,t+.02,.05,'sine',.04)}}
let hold=null;
const hit=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return keys().find(k=>x>=k.x-3&&x<=k.x+k.w+3&&y>=k.y-3&&y<=k.y+k.h+3)};
cv.addEventListener('pointerdown',e=>{const k=hit(e);if(!k)return;e.preventDefault();press(k.v);if(k.v==='E'){clearInterval(hold);hold=setInterval(()=>press('E'),130)}});
cv.addEventListener('pointermove',e=>{cv.style.cursor=hit(e)?'pointer':'default'});
cv.addEventListener('pointerleave',()=>clearInterval(hold));
addEventListener('pointerup',()=>clearInterval(hold));addEventListener('pointercancel',()=>clearInterval(hold));
addEventListener('keydown',e=>{let v=null;if(/^[0-9]$/.test(e.key))v=e.key;else if(e.key==='Backspace')v='B';else if(e.key==='Delete'||e.key==='Escape')v='C';else if(e.key==='Enter'||e.code==='Space')v='E';if(!v)return;e.preventDefault();if(v==='E'&&e.repeat&&performance.now()-lastW<120)return;press(v)});
$('mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.6;$('mute').textContent=muted?'🔇':'🔊'};
refresh();
toast('🏧 <b>ATM này không bao giờ hết tiền.</b><br>Nhập số tiền trên bàn phím ATM, bấm RÚT rồi ra cửa hàng phá của.');
requestAnimationFrame(frame);
})();
</script>
